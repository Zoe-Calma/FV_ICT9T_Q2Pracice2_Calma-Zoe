<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Practice 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        h1{
            background-color:rgb(40, 58, 69);
            color:rgb(170, 38, 12);
            box-shadow: 10px 10px 5px; 
        }

        body{
            background-image: url('https://wegotthiscovered.com/wp-content/uploads/2023/03/Shadow_and_Bone_Ketterdam.jpg');
            background-size: cover;
            background-repeat: no-repeat;
        }
        #bat{
            height: 300px;
            width: 300px;
        }
        #head1{
            font-family:fantasy;
            font-size: 30px;
            color:rgb(189, 189, 189);
        }
        #row2, #row3{
            font-family: cursive;
            font-size: 30px;
            color:rgb(189, 189, 189)
        }
        .col-lg-8{
            background-color:rgba(229, 31, 5, 0.383);
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="row justify-content-center">
            <h1 class="text-center">Halloween Party</h1>
        </div>

        <br>

        <div class="row">
            <img class="img-fluid rounded mx-auto d-block" src="https://i.pinimg.com/736x/ca/cd/e6/cacde6f1898282842deddec57060f43c.jpg" id="bat" alt="hallow">
        </div>

        <br>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <table class=" align-middle text-center">
                    <thead>
                        <tr class="table table-hover" id="head1">
                            <th scope="col" style="width:40%">Saturday</th>
                            <th scope="col" style="width:20%">31</th>
                            <th scope="col" style="width:40%">October</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr id="row2">
                            <td colspan="3">3:00 AM</td>
                        </tr>

                        <tr id="row3">
                            <td colspan="2">6 Crows Street Ketterdam, Kerch</td>
                            <td>RSVP</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>
